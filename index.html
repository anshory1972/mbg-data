*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:0 16px 48px}

.brand{font:600 12px/1.3 system-ui,sans-serif;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-top:2px}
.lang{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);color:var(--muted);font:600 13px system-ui,sans-serif;padding:8px 12px;min-height:40px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
h1{font:600 28px/1.25 Georgia,"Times New Roman",serif;margin:6px 0 8px}
.lead{color:var(--muted);margin:0 0 14px;max-width:760px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
nav a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px}
h2{font:600 21px/1.3 Georgia,"Times New Roman",serif;margin:40px 0 10px;scroll-margin-top:12px}
h3{font:600 16px/1.35 system-ui,sans-serif;margin:20px 0 6px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px}
.controls{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media (min-width:700px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.ctl,.ctlh{display:block;font-size:13px;color:var(--muted)}
select{display:block;width:100%;margin-top:4px;min-height:44px;padding:8px 10px;font:15px system-ui,sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.seg button{flex:1 1 auto;min-height:40px;padding:6px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:14px system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}
.row2{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media (min-width:700px){.row2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ttl{font:600 17px/1.35 Georgia,serif;margin:6px 0 2px}
.sub{font-size:14px;color:var(--ink);margin:0 0 10px;max-width:760px}
.unitline{font:600 14px/1.4 system-ui,sans-serif;color:var(--accent);margin:4px 0 4px}
.unitline span{font-weight:400;color:var(--muted)}
.cmp{font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:6px 10px;margin:0 0 10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top;white-space:nowrap}
thead th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface);white-space:normal;min-width:72px}
th.rh,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;white-space:normal;min-width:118px;max-width:200px;font-weight:600;font-size:13px;color:var(--ink)}
td.c{cursor:pointer;position:relative;min-width:84px}
td.c .v,td.c .ci{position:relative;z-index:1;display:block}
td.c .ci{font-size:11px;color:var(--muted)}
td.c.sel{outline:2px solid var(--slate);outline-offset:-2px}
td.c.hid .v{color:var(--muted)}
td.c .w{color:var(--warn);font-weight:700}
tr:last-child td,tr:last-child th{border-bottom:0}
.legend{font-size:12px;color:var(--muted);margin:8px 0 0}
.detail{margin-top:12px;background:var(--sel);border-radius:8px;padding:12px 14px;font-size:14px}
.detail dl{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin:8px 0 0}
.detail dt{color:var(--muted)}
.detail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.src{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px;font-size:14px}
.q{font-family:Georgia,serif;background:var(--paper);border-left:3px solid var(--accent);padding:8px 12px;margin:6px 0}
.qe{color:var(--muted);font-size:13px;margin:0 0 6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--rule);border-radius:8px;color:var(--slate);text-decoration:none;font-size:14px;background:var(--paper)}
.qlist{display:grid;gap:10px}
.qi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.qi .code{font:600 13px system-ui,sans-serif;color:var(--accent)}
.qi .id{font-family:Georgia,serif;margin:2px 0}
.qi .en{color:var(--muted);font-size:14px;margin:0}
.qi .use{font-size:12px;color:var(--slate);margin-top:4px}
.pages{display:grid;gap:12px;margin-top:12px}
.pages a{display:block;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff}
.pages img{display:block;width:100%;height:auto}
.prose p,.prose li{max-width:760px}
.prose ul{padding-left:20px}
dl.gl{margin:0}
dl.gl dt{font-weight:600;margin-top:10px}
dl.gl dd{margin:2px 0 0;color:var(--ink);max-width:760px}
footer{margin-top:40px;border-top:1px solid var(--rule);padding-top:14px;color:var(--muted);font-size:13px}
a{color:var(--slate)}
.hidden{display:none !important}
.swipe{font-size:12px;color:var(--slate);margin:0 0 6px}
@media (max-width:480px){h1{font-size:23px}table{font-size:12px}th,td{padding:6px 5px}
 th.rh,td:first-child{min-width:78px;max-width:104px;font-size:12px}
 td.c{min-width:60px}thead th{min-width:56px;font-size:11px}

 id: "<h3>Apa itu Susenas?</h3><p>Survei Sosial Ekonomi Nasional (Susenas) adalah survei rumah tangga utama Badan Pusat Statistik (BPS). Susenas sudah dilaksanakan sejak tahun 1960-an dan menjadi dasar angka kemiskinan dan ketimpangan resmi Indonesia. Petugas BPS mewawancarai rumah tangga secara langsung. Putaran September mencatat pengeluaran konsumsi rumah tangga secara rinci.</p>" +
     "<p>Susenas September 2025 mencakup 76.928 rumah tangga dan 259.865 orang di seluruh provinsi. Sampel dipilih dua tahap: BPS memilih wilayah pencacahan dalam setiap strata (provinsi, perkotaan atau perdesaan), lalu memilih rumah tangga di setiap wilayah pencacahan terpilih. Setiap rumah tangga mewakili sejumlah rumah tangga lain, sehingga hasilnya ditimbang agar mewakili seluruh penduduk Indonesia.</p>" +

     "<p>The September 2025 Susenas covers 76,928 households and 259,865 people in every province. The sample is drawn in two stages: BPS selects enumeration areas within each stratum (province, urban or rural), then selects households within each selected area. Each household stands for many others, so results are weighted to represent the whole population of Indonesia.</p>" +
     "<h3>What is MBG?</h3><p>Makan Bergizi Gratis (MBG, Free Nutritious Meals) is a government programme that began in January 2025. Meals are cooked in kitchens called Satuan Pelayanan Pemenuhan Gizi (SPPG) and delivered to schools and other target groups. According to the questionnaire, the target groups are school children from primary to senior secondary school, pregnant women, mothers breastfeeding a child aged 0–23 months, and children under five.</p>" +
     "<h3>The MBG questions in Susenas</h3><p>The September 2025 Susenas is the first national survey to ask about MBG. The questions were designed by the National Economic Council (Dewan Ekonomi Nasional) together with BPS. For every household member, the survey records whether the person belongs to a target group, whether they received MBG in the last week, since which month, on how many days, what the meals contained and how good they were. School children were also asked about breakfast, days absent and their views of MBG.</p>" +

}
function render() {
  sync();
  var byArea = S.by === "__area";
  var rows = rowsFor(S.table, S.pop, S.measure, byArea ? "Indonesia" : S.by);
  if (byArea) {
    // rows become Total / Urban / Rural; _orig keeps the data row for the detail panel
    rows = rows.map(function (r) { var o = {}; for (var k in r) o[k] = r[k]; o.category = r.area; o.area = "Total"; o._orig = r; return o; });
  }
  // for counts, the weighted view repeats the estimate, so it is not offered
  S.stat = rows.length ? rows[0].statistic : "percent";
  if ((S.stat === "total" || S.table === "T1") && S.show === "w") S.show = "est";
  if (S.stat === "mean") S.show = "est";
  var hasSplit = rows.some(function (r) { return r.split_category; });
  // with a split (recipients / non-recipients) and several rows, show one answer at a time
  var outsAll = uniq(rows.map(function (r) { return r.outcome; }));
  var needOut = hasSplit && uniq(rows.map(function (r) { return r.category; })).length > 1 && outsAll.length > 1;
  wOut.classList.toggle("hidden", !needOut);
  if (needOut) {
    if (outsAll.indexOf(S.out) < 0) S.out = outsAll[0];
    fillSelect(sOut, outsAll, outLabel, S.out);
    rows = rows.filter(function (r) { return r.outcome === S.out; });
  }
  var cats = uniq(rows.map(function (r) { return r.category; }));
  var outs = uniq(rows.map(function (r) { return r.outcome; }));
  var mode, rowKeys, colKeys;
  if (hasSplit) {
    colKeys = SPLITORDER.filter(function (s) { return rows.some(function (r) { return r.split_category === s; }); });
    if (cats.length > 1) { mode = "cat-split"; rowKeys = cats; } else { mode = "out-split"; rowKeys = outs; }
  } else if (byArea) { mode = "cat-out"; rowKeys = cats; colKeys = outs; }
  else if (outs.length === 1) { mode = "cat-area"; rowKeys = cats; colKeys = AREAS; }
  else if (cats.length === 1) { mode = "out-area"; rowKeys = outs; colKeys = AREAS; }
  else { mode = "cat-out"; rowKeys = cats; colKeys = outs; }
  var areaSel = !byArea && (mode === "cat-out" || mode === "cat-split" || mode === "out-split");
  var areaNow = byArea ? "Total" : S.area;
  wArea.classList.toggle("hidden", !areaSel);
  cmpnote.classList.toggle("hidden", !hasSplit);

  function find(rk, ck) {
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (mode === "cat-area" && r.category === rk && r.area === ck) return r;
      if (mode === "out-area" && r.outcome === rk && r.area === ck) return r;
      if (mode === "cat-out" && r.category === rk && r.outcome === ck && r.area === areaNow) return r;
      if (mode === "cat-split" && r.category === rk && r.split_category === ck && r.area === areaNow) return r;
      if (mode === "out-split" && r.outcome === rk && r.split_category === ck && r.area === areaNow) return r;
    }
    return null;
  }
  function rowLabel(k) { return (mode === "out-area" || mode === "out-split") ? outLabel(k) : byArea ? (k === "Total" ? "Indonesia" : areaLabel(k)) : tr(CAT, k); }
  function colLabel(k) { return mode === "cat-out" ? outLabel(k) : (mode === "cat-split" || mode === "out-split") ? tr(SPLITCAT, k) : areaLabel(k); }

  var head = (mode === "out-area" || mode === "out-split") ? "" : byArea ? (S.lang === "id" ? "Wilayah" : "Area") : tr(BY, S.by);
  var h = '<thead><tr><th scope="col" class="rh">' + esc(head) + "</th>" +
          colKeys.map(function (k) { return '<th scope="col">' + esc(colLabel(k)) + "</th>"; }).join("") + "</tr></thead><tbody>";
  rowKeys.forEach(function (rk) {
    h += '<tr><th scope="row" class="rh">' + esc(rowLabel(rk)) + "</th>";
    colKeys.forEach(function (ck) {
      var r = find(rk, ck);
      if (!r) { h += '<td style="color:var(--muted);font-size:12px">' + t("na") + "</td>"; return; }
      var c = cellValue(r), id = R.indexOf(r._orig || r);
      h += '<td class="c' + (r.flag === "hidden" ? " hid" : "") + (S.sel === id ? " sel" : "") + '" data-id="' + id + '" tabindex="0">' +
           '<span class="v">' + c.v + "</span>" + (c.ci ? '<span class="ci">' + c.ci + "</span>" : "") + "</td>";
    });
    h += "</tr>";
  });
  tbl.innerHTML = h + "</tbody>";
  var tw = $("tw");
  $("swipe").classList.toggle("hidden", !(tw.scrollWidth > tw.clientWidth + 2));

  var r0 = rows[0] || {};
  var stat = r0.statistic || "percent";
  tblttl.textContent = tr(TOPIC, S.table) + " — " + tr(POP, S.pop);
  var unit = stat === "percent" ? (S.lang === "id" ? "Persen" : "Percent")
           : stat === "mean" ? (S.lang === "id" ? "Rata-rata" : "Mean") : (S.lang === "id" ? "Jumlah orang" : "Number of people");
  var dkey = S.measure;
  var desc = DESC[dkey] ? DESC[dkey][S.lang] : unit + ".";
  var isMean = stat === "mean";
  var ukey = S.show === "est" ? unitKey(S.measure, stat) : S.show === "w" ? "wpeople" : "npeople";
  if (S.show === "w") desc = isMean
    ? (S.lang === "id" ? "Jumlah dalam kelompok ini, perkiraan untuk seluruh Indonesia." : "Number in this group, an estimate for all of Indonesia.")
    : (S.lang === "id" ? "Jumlah orang dengan jawaban ini, perkiraan untuk seluruh Indonesia." : "Number of people with this answer, an estimate for all of Indonesia.");
  if (S.show === "n") desc = isMean
    ? (S.lang === "id" ? "Jumlah dalam sampel survei yang menjawab pertanyaan ini." : "Number in the survey sample who answered this question.")
    : (S.lang === "id" ? "Jumlah orang dalam sampel survei dengan jawaban ini." : "Number of people in the survey sample with this answer.");
  var qn = r0.question || "";
  unitline.innerHTML = (S.lang === "id" ? "Satuan: " : "Unit: ") + esc(UNIT[ukey][S.lang]) +
    (qn ? ' <span>· ' + (S.lang === "id" ? "Pertanyaan " : "Question ") + esc(qn) + "</span>" : "");
  desc += " " + t(S.show === "n" ? "wnote_n" : "wnote");
  tblsub.textContent = desc + (areaSel ? " " + (S.lang === "id" ? "Wilayah: " : "Area: ") + areaLabel(S.area) + "." : "") + " BPS, Susenas September 2025.";
  renderDetail(); renderSource(r0); renderSeg();
}
function renderSeg() {
  // the first button names what the table shows
  var estKey = S.stat === "mean" ? "show_mean" : S.stat === "total" ? "show_total" : "show_pct";
  var btns = [["est", estKey], ["w", "show_w"], ["n", "show_n"]];
  if (S.stat === "total" || S.table === "T1") btns.splice(1, 1);
  if (S.stat === "mean") btns = btns.slice(0, 1);
  gShow.parentElement.classList.toggle("hidden", btns.length < 2);
  gShow.innerHTML = btns.map(function (p) {
    return '<button type="button" data-show="' + p[0] + '" aria-pressed="' + (S.show === p[0]) + '">' + t(p[1]) + "</button>";
  }).join("");
  gArea.innerHTML = AREAS.map(function (a) {
    return '<button type="button" data-area="' + a + '" aria-pressed="' + (S.area === a) + '">' + areaLabel(a) + "</button>";
  }).join("");
}
function renderDetail() {
  var r = S.sel !== null ? R[S.sel] : null;
  var byOk = r && (r.breakdown === S.by || (S.by === "__area" && r.breakdown === "Indonesia"));
  if (!r || r.table !== S.table || r.population !== S.pop || group(r.outcome) !== S.measure || !byOk) { detail.classList.add("hidden"); return; }
  var pct = r.statistic === "percent", whole = r.statistic === "total";
  var d = pct ? 2 : 3;
  var est = r.estimate === null ? "—" : (whole ? full(r.estimate) + " " + (S.lang === "id" ? "orang" : "people")
          : num(r.estimate, d) + (pct ? "%" : meanUnit(r.outcome)));
  var ci = r.ci_low === null ? "—" : (whole ? full(r.ci_low) + " – " + full(r.ci_high) : num(r.ci_low, d) + " – " + num(r.ci_high, d));
  function line(k, v) { return "<dt>" + t(k) + "</dt><dd>" + v + "</dd>"; }
  function n(v) { return v === null ? "—" : full(v); }
  var parts = r.breakdown === "Indonesia" ? [areaLabel(r.area)] : [tr(CAT, r.category), areaLabel(r.area)];
  if (r.split_category) parts.push(tr(SPLITCAT, r.split_category));
  parts.push(outLabel(r.outcome));
  var h = "<b>" + esc(parts.join(" · ")) + "</b><dl>" +
    line("d_est", est) + line("d_ci", ci) + line("d_rse", r.rse_pct === null ? "—" : num(r.rse_pct, 1) + "%") +
    line("d_np", n(r.n_persons)) + line("d_na", n(r.n_answered)) + line("d_nh", n(r.n_households)) +
    (r.n_yes !== null ? line("d_ny", n(r.n_yes)) : "") + line("d_wp", n(r.weighted_persons)) +
    (r.weighted_yes !== null ? line("d_wy", n(r.weighted_yes)) : "") + "</dl>";
  if (r.flag) h += '<p style="margin:8px 0 0;color:var(--warn)">' + t("f_" + r.flag) + "</p>";
  detail.innerHTML = h; detail.classList.remove("hidden");
}
function renderSource(r) {
  var codes = [];
  (r.question || "").split(/,\s*/).forEach(function (c) {
    if (c === "1102-1106") { codes.push("1106"); return; }
    if (c === "1113") { codes.push("1113A", "1113B"); return; }
    codes.push(c);
  });
  codes = uniq(codes).filter(function (c) { return QIDX[c] && c !== "1101" && c !== "1104" && c !== "1105" && c !== "1102" && c !== "1103"; });
  var h = "<b>" + t("s_q") + "</b>";
  codes.forEach(function (c) {
    var q = QIDX[c];
    h += '<div class="q">' + esc(c + ". " + q[1]) + "</div>";
    if (S.lang === "en") h += '<p class="qe">English: ' + esc(q[2]) + "</p>";
  });
  h += '<p class="qe">' + t("s_pop") + ": " + esc(tr(POP, S.pop)) + "</p>";
  h += '<div class="links"><a href="#kuesioner">' + t("l_qsec") + "</a>" +
       '<a href="files/' + CSVNAME[r.csv || S.table] + '.csv" download>' + t("l_csv") + "</a></div>";
  src.innerHTML = h;
}
function renderQuestions() {
  qlist.innerHTML = QS.map(function (q) {
    return '<div class="qi"><div class="code">' + esc(q[0]) + '</div><p class="id">' + esc(q[1]) + '</p><p class="en">' + esc(q[2]) +
           '</p><div class="use">' + (q[3] ? t("used") + esc(q[3].split(/,\s*/).map(function (c) { return tr(TOPIC, c); }).join(", ")) : t("notused")) + "</div></div>";
  }).join("");
}
function renderStatic() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i")); });
  document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === S.lang); });
  about.innerHTML = ABOUT[S.lang];
  howto.innerHTML = HOWTO[S.lang];
  renderQuestions();
  foot.textContent = t("foot") + (META.version || "") + ".";
}

// ---------------------------------------------------------------- events
function $(id) { return document.getElementById(id); }
var sTable = $("sTable"), sPop = $("sPop"), sMeasure = $("sMeasure"), sBy = $("sBy"), sOut = $("sOut"),
    wMeasure = $("wMeasure"), wBy = $("wBy"), wOut = $("wOut"), wArea = $("wArea"), gShow = $("gShow"), gArea = $("gArea"),
    tbl = $("tbl"), tblttl = $("tblttl"), tblsub = $("tblsub"), unitline = $("unitline"), cmpnote = $("cmpnote"),
    detail = $("detail"), src = $("src"), about = $("about"), howto = $("howto"), qlist = $("qlist"), foot = $("foot");

sTable.addEventListener("change", function () { S.table = sTable.value; S.sel = null; render(); });
sPop.addEventListener("change", function () { S.pop = sPop.value; S.sel = null; render(); });
sMeasure.addEventListener("change", function () { S.measure = sMeasure.value; S.sel = null; render(); });
sBy.addEventListener("change", function () { S.by = sBy.value; S.sel = null; render(); });
sOut.addEventListener("change", function () { S.out = sOut.value; S.sel = null; render(); });
gShow.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { S.show = b.getAttribute("data-show"); render(); } });
gArea.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { S.area = b.getAttribute("data-area"); S.sel = null; render(); } });
function pick(e) { var td = e.target.closest("td.c"); if (td) { S.sel = +td.getAttribute("data-id"); render(); } }
tbl.addEventListener("click", pick);
tbl.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } });
document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () { S.lang = b.getAttribute("data-lang"); try { localStorage.setItem("mbgLang", S.lang); } catch (x) {} renderStatic(); if (R.length) render(); });
});
window.addEventListener("resize", function () { var tw = $("tw"); if (tw) $("swipe").classList.toggle("hidden", !(tw.scrollWidth > tw.clientWidth + 2)); });
try { var saved = localStorage.getItem("mbgLang"); if (saved === "en" || saved === "id") S.lang = saved; } catch (x) {}

renderStatic();
fetch("data.json", {cache: "no-cache"})
  .then(function (r) { return r.json(); })
  .then(function (d) {
    META = d.meta || {};
    R = d.rows.map(function (a) { var o = {}; d.cols.forEach(function (c, i) { o[c] = a[i]; }); o.csv = o.table;
      if (o.table === "T2") { o.table = "T1"; o.outcome = "received_n"; } return o; });
    renderStatic(); render();
  })
  .catch(function () { tbl.innerHTML = "<tbody><tr><td>Data could not be loaded.</td></tr></tbody>"; });
})();
</script>
